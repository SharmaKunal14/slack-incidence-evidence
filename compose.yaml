services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_copilot
      POSTGRES_PASSWORD: incident
      POSTGRES_USER: incident
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U incident -d incident_copilot']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-southeast-2
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '4566:4566'
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/10-create-queues.sh:ro

volumes:
  postgres-data:
