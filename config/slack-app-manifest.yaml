display_information:
  name: OnRecord
  description: Builds evidence-backed incident records your team can trust.
  background_color: '#172033'

features:
  bot_user:
    display_name: OnRecord
    always_online: false
  shortcuts:
    - name: Scope incident evidence
      type: message
      callback_id: scope_incident
      description: Select a bounded set of channels and an incident time window.

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands

settings:
  interactivity:
    is_enabled: true
    request_url: https://example.invalid/integrations/slack/events
  event_subscriptions:
    request_url: https://example.invalid/integrations/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
