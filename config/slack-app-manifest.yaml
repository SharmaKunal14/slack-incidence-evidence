display_information:
  name: Incident Evidence Copilot
  description: Creates evidence-backed incident review workflows from Slack.
  background_color: '#172033'

features:
  bot_user:
    display_name: Incident Copilot
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read

settings:
  event_subscriptions:
    request_url: https://example.invalid/integrations/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
