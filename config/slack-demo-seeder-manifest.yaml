display_information:
  name: OnRecord Demo Seeder
  description: Seeds a synthetic two-person incident into a disposable Slack workspace.
  background_color: '#172033'

oauth_config:
  scopes:
    user:
      - channels:write
      - channels:write.invites
      - chat:write

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
