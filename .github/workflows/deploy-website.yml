name: Website CI/CD

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify static website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_SITE_URL: https://onrecord.kunal-sharma.in
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Report immutable GitHub OIDC identifiers
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          echo "repository_id=$REPOSITORY_ID"
          echo "repository_owner_id=$REPOSITORY_OWNER_ID"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint source
        run: npm run lint

      - name: Build and test the S3 artifact
        run: npm run test:s3

      - name: Preserve the verified website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onrecord-website-${{ github.sha }}
          path: website/out
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  deploy:
    name: Deploy production website
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-website
      url: https://onrecord.kunal-sharma.in
    concurrency:
      group: onrecord-production-website
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      S3_BUCKET: onrecord-public-site-prod
      SITE_URL: https://onrecord.kunal-sharma.in
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ap-southeast-2
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_WEBSITE_DEPLOY_ROLE_ARN }}
      CLOUDFRONT_DISTRIBUTION_ID: E3EMVCLM5MIYJP
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download the verified website artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: onrecord-website-${{ github.sha }}
          path: website/out

      - name: Validate deployment configuration
        run: |
          for name in AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required production-website variable is missing: $name"
              exit 1
            fi
          done

      - name: Acquire short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-website-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Upload the verified artifact and invalidate CloudFront
        working-directory: website
        run: bash scripts/upload-s3-cloudfront.sh

      - name: Smoke-test the public website
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "$SITE_URL/" >/dev/null
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "$SITE_URL/review-demo/demo.html" >/dev/null
          curl --fail --silent --show-error \
            --header 'Range: bytes=0-1023' \
            "$SITE_URL/video/onrecord-workflow-120s.mp4" >/dev/null
